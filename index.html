<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
    } catch (e) {}
  </script>
</head>
<body>
  <main class="app">
    <form id="search-form" class="glass search">
      <input id="search-input" type="text" placeholder="Search city..." autocomplete="off" />
      <button type="submit">Search</button>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </form>

    <section class="glass current">
      <h1 id="location">Boca Raton</h1>
      <div id="temp" class="temp">--°</div>
      <div id="condition" class="condition">Loading...</div>
      <div id="hi-lo" class="hi-lo"></div>
    </section>

    <section class="glass">
      <h2>Hourly Forecast</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="glass">
      <h2>7-Day Forecast</h2>
      <div id="daily" class="daily"></div>
    </section>

    <section class="details">
      <div class="glass detail"><h2>Feels Like</h2><p id="feels">--</p></div>
      <div class="glass detail"><h2>Humidity</h2><p id="humidity">--</p></div>
      <div class="glass detail"><h2>Wind</h2><p id="wind">--</p></div>
      <div class="glass detail"><h2>Precipitation</h2><p id="precip">--</p></div>
    </section>

    <p class="credit">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
